[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ri_chat"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Gabriel Santiago" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain-text-splitters>=1.1.3",
    "loguru>=0.7.3",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pymupdf>=2.1",
    "tqdm>=4.67.1",
    "typer>=0.15.0",
]


[tool.ruff]
line-length = 99
src = ["ri_chat"]
include = ["pyproject.toml", "ri_chat/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ri_chat"]
force-sort-within-sections = true

